name: Build and publish Android APK
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install and build web bundle
        run: npm ci && npm run build
      - name: Sync Capacitor app
        run: npx cap sync android
      - name: Build signed-for-sideloading debug APK
        working-directory: android
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace > gradle-build.log 2>&1
          result=$?
          if [ $result -ne 0 ]; then
            { grep -E '^(FAILURE:|\* What went wrong:|Execution failed for task|Could not resolve|Could not find|e: |error:|A problem occurred|\* Exception is:)' gradle-build.log | tail -n 12; tail -n 4 gradle-build.log; } | while IFS= read -r line; do echo "::error::$line"; done
            exit $result
          fi
      - name: Prepare named APK and checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TerraSpectra-AgroLab-v1.0.0.apk
          sha256sum TerraSpectra-AgroLab-v1.0.0.apk > TerraSpectra-AgroLab-v1.0.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TerraSpectra-AgroLab-v1.0.0
          path: |
            TerraSpectra-AgroLab-v1.0.0.apk
            TerraSpectra-AgroLab-v1.0.0.apk.sha256
          if-no-files-found: error
      - name: Publish downloadable release assets for one-tap download
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TerraSpectra-AgroLab-v1.0.0.apk
            TerraSpectra-AgroLab-v1.0.0.apk.sha256
